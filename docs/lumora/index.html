<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Lumora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E10; --s1:#161618; --s2:#1E1E21; --s3:#2A2A2E;
  --ln:rgba(255,255,255,.06);
  --tx:#EDEBE7; --mu:#8C8B90; --mu2:#5E5D63;
  --iv:#EFE9DE; --ivTx:#141414;
  --up:#5DBB8B; --dn:#E36A62;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);
  font-family:Geist,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:active{opacity:.6}
svg{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden}

.screen{position:absolute;inset:0;overflow-y:auto;display:none;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 100px)}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0}to{opacity:1}}

/* splash */
#splash{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .mark{width:58px;height:58px;animation:rise .9s ease both}
#splash .wm{font-size:13px;font-weight:500;letter-spacing:.42em;color:var(--mu);padding-left:.42em;animation:rise .9s .15s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:26px}
.acct{display:flex;align-items:center;gap:11px}
.av{width:36px;height:36px;border-radius:50%;background:var(--s2);color:var(--iv);font-size:12.5px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.acct .nm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:3px}
.acct .nm svg{width:14px;height:14px;stroke:var(--mu)}
.acct .sub{font-size:12.5px;color:var(--mu);margin-top:1px}
.ibs{display:flex;gap:4px}
.ib{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.ib svg{width:21px;height:21px;stroke:var(--tx)}

.lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lbl h3{font-size:12px;font-weight:500;color:var(--mu);letter-spacing:.09em;text-transform:uppercase}
.lbl span,.lbl button{font-size:12.5px;color:var(--mu)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mu2);margin-right:6px;vertical-align:middle;position:relative;top:-1px}
.dot.on{background:var(--up)}
.up{color:var(--up)} .dn{color:var(--dn)}

/* home */
.hello{font-size:26px;font-weight:400;letter-spacing:-.035em;line-height:1.2;margin-bottom:30px}
.hello span{color:var(--mu)}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 24px;margin:0 -24px 36px;padding:0 24px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.pc{flex:none;width:146px;background:var(--s1);border-radius:18px;padding:14px 14px 12px;scroll-snap-align:start}
.pc .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--mu)}
.pc .h .ci{width:20px;height:20px}
.pc .pu{font-size:17px;font-weight:500;margin-top:16px;letter-spacing:-.02em}
.pc .pi{font-size:12px;color:var(--mu);margin-top:3px}
.pc .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;gap:8px}
.pc .pg{font-size:12px;font-weight:500}
.pc svg{width:62px;height:22px}
.flash{animation:flash 1s ease}
@keyframes flash{30%{color:var(--iv);opacity:.55}}

.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0}
.ci{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden}
.ci svg{width:100%;height:100%;display:block;stroke:none}
.row .mid{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:500}
.row .s{font-size:13px;color:var(--mu);margin-top:3px}
.row .r{text-align:right}
.row .sp{width:56px;height:22px;flex:none;margin-right:6px}
.row.zero{opacity:.5}

/* wallet */
.bal{margin:4px 0 30px}
.bal .k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.bal .k svg{width:16px;height:16px;stroke:var(--mu)}
.bal .v{font-size:44px;font-weight:400;letter-spacing:-.05em;line-height:1.1;margin-top:10px}
.bal .v small{font-size:.6em;color:var(--mu);letter-spacing:-.02em}
.bal .i{font-size:16px;color:#BDBBB6;margin-top:6px;font-weight:400}
.bal .c{font-size:13px;margin-top:12px}
.acts{display:flex;justify-content:space-between;margin:0 6px 40px}
.act{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;color:var(--mu);width:64px}
.act span{width:52px;height:52px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:flex;align-items:center;justify-content:center}
.act svg{width:20px;height:20px;stroke:var(--tx)}

/* coin */
.back{display:flex;align-items:center;gap:6px;height:48px;font-size:16px;font-weight:500;margin:0 0 10px -6px}
.back svg{width:22px;height:22px;stroke:var(--tx)}
.hero{text-align:center;margin:8px 0 28px}
.hero .ci{width:48px;height:48px;margin:0 auto 18px}
.hero .a{font-size:32px;font-weight:400;letter-spacing:-.04em}
.hero .b{font-size:15px;color:#BDBBB6;margin-top:8px}
.hero .c{font-size:13px;color:var(--mu);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px}
.btn{height:50px;border-radius:14px;background:var(--s1);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}
.btn.pri{background:var(--iv);color:var(--ivTx)}
.chartHd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chartHd .p{font-size:20px;font-weight:500;letter-spacing:-.03em}
.chartHd .g{font-size:13px}
.chart{width:100%;height:140px;display:block;margin:10px 0 4px}
.rng{display:flex;justify-content:space-between;margin-bottom:30px}
.rng span{font-size:12px;color:var(--mu2);padding:6px 10px;border-radius:8px}
.rng span.on{color:var(--tx);background:var(--s1)}
.kv{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--ln);font-size:14px}
.kv span:first-child{color:var(--mu)}

/* settings */
.grp{font-size:12px;font-weight:500;color:var(--mu);letter-spacing:.09em;text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--s1);border-radius:16px;padding:16px}
.wcard{display:flex;align-items:center;gap:13px}
.wcard .t{font-size:15.5px;font-weight:500}
.wcard .s{font-size:13px;color:var(--mu);margin-top:2px}
.wcard .tick{margin-left:auto;width:20px;height:20px;stroke:var(--iv)}
.fld+.fld{margin-top:22px;padding-top:20px;border-top:1px solid var(--ln)}
.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.inp{display:flex;align-items:center;background:var(--s2);border-radius:12px;padding:0 15px;height:52px;border:1px solid transparent;transition:border-color .2s}
.inp:focus-within{border-color:rgba(239,233,222,.35)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:20px;font-weight:500;letter-spacing:-.02em;-webkit-user-select:text;user-select:text}
.inp input::-webkit-inner-spin-button,.inp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inp input{-moz-appearance:textfield}
.inp span{font-size:13px;color:var(--mu);font-weight:500}
.prev{font-size:12.5px;color:var(--mu);margin-top:10px;line-height:1.5}
.prev b{color:var(--tx);font-weight:500}
.save{width:100%;margin-top:18px}
.fine{font-size:11px;color:var(--mu2);text-align:center;margin-top:28px;line-height:1.5}

/* nav */
nav{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(14,14,16,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
nav .bar{display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--mu2);padding:4px 40px;letter-spacing:.01em}
nav svg{width:22px;height:22px;stroke:var(--mu2)}
nav button.on{color:var(--iv)}
nav button.on svg{stroke:var(--iv)}

/* drawer */
#scrim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;z-index:31;width:80%;max-width:360px;background:var(--s1);transform:translateX(-101%);transition:transform .34s cubic-bezier(.22,.8,.24,1);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 0 calc(env(safe-area-inset-bottom) + 18px)}
#drawer.on{transform:none}
#drawer .dh{padding:0 26px 26px}
#drawer .dh .av{width:46px;height:46px;font-size:15px;background:var(--s3);margin-bottom:16px}
#drawer .dh .n{font-size:20px;font-weight:500;letter-spacing:-.02em}
#drawer .dh .s{font-size:13px;color:var(--mu);margin-top:3px}
#drawer .sec{padding:18px 26px 6px;font-size:12px;font-weight:500;color:var(--mu);letter-spacing:.09em;text-transform:uppercase;border-top:1px solid var(--ln)}
.wrow{display:flex;align-items:center;gap:13px;padding:10px 26px;width:100%}
.wrow .av{background:var(--s3)}
.wrow .t{font-size:15px;font-weight:500}
.wrow .s{font-size:12.5px;color:var(--mu);margin-top:2px}
.wrow .tick{margin-left:auto;width:18px;height:18px;stroke:var(--iv)}
#drawer .fill{flex:1}
.mi{display:flex;align-items:center;gap:16px;padding:14px 26px;width:100%;font-size:15px}
.mi svg{width:20px;height:20px;stroke:var(--mu)}

#toast{position:absolute;left:50%;bottom:104px;z-index:60;transform:translate(-50%,10px);background:var(--s3);color:var(--tx);font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

  <div id="splash">
    <svg class="mark" viewBox="0 0 64 64"><defs><mask id="cm"><rect width="64" height="64" fill="#fff"/><circle cx="38" cy="25" r="17" fill="#000"/></mask></defs>
      <circle cx="32" cy="32" r="22" fill="#EFE9DE" mask="url(#cm)" stroke="none"/></svg>
    <div class="wm">LUMORA</div>
  </div>

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <div class="top" data-top></div>
    <div class="hello" id="greet" style="color:var(--tx)">Good evening</div>
    <div class="lbl"><h3>Prices</h3><span><i class="dot" data-dot></i><span data-livetx>Offline</span></span></div>
    <div class="cards" id="cards"></div>
    <div class="lbl"><h3>Markets</h3><span>24h</span></div>
    <div id="mkt"></div>
  </section>

  <!-- WALLET -->
  <section class="screen" id="s-wallet">
    <div class="top" data-top></div>
    <div class="bal">
      <div class="k">Total balance <button onclick="toggleHide()" style="display:flex"><svg viewBox="0 0 24 24" id="eye"></svg></button></div>
      <div class="v" id="totUsd"></div>
      <div class="i" id="totInr"></div>
      <div class="c" id="totChg"></div>
    </div>
    <div class="acts">
      <button class="act" onclick="toast('Sending is unavailable')"><span><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></span>Send</button>
      <button class="act" onclick="toast('Address copied')"><span><svg viewBox="0 0 24 24"><path d="M17 7 7 17M16 17H7V8"/></svg></span>Receive</button>
      <button class="act" onclick="toast('Buying is unavailable')"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Buy</button>
      <button class="act" onclick="toast('Swapping is unavailable')"><span><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></span>Swap</button>
    </div>
    <div class="lbl"><h3>Assets</h3><button onclick="go('home')">Prices</button></div>
    <div id="assets"></div>
  </section>

  <!-- COIN -->
  <section class="screen" id="s-coin">
    <button class="back" onclick="go(prevScreen)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span id="cTitle"></span></button>
    <div class="hero"><div id="cIcon"></div><div class="a" id="cAmt"></div><div class="b" id="cUsd"></div><div class="c" id="cInr"></div></div>
    <div class="two"><button class="btn pri" onclick="toast('Sending is unavailable')">Send</button><button class="btn" onclick="toast('Address copied')">Receive</button></div>
    <div class="chartHd"><div class="p" id="cPrice"></div><div class="g" id="cChg"></div></div>
    <svg class="chart" id="cChart" viewBox="0 0 320 140" preserveAspectRatio="none"></svg>
    <div class="rng"><span>1H</span><span>1D</span><span class="on">1W</span><span>1M</span><span>1Y</span><span>All</span></div>
    <div class="kv"><span>Price in USD</span><span id="kUsd"></span></div>
    <div class="kv"><span>Price in INR</span><span id="kInr"></span></div>
    <div class="kv"><span>24h change</span><span id="kChg"></span></div>
    <div class="kv"><span>Holding</span><span id="kHold"></span></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings">
    <button class="back" onclick="go(prevScreen)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Settings</button>
    <div class="grp">Wallet</div>
    <div class="card wcard">
      <div class="av" data-ini></div>
      <div><div class="t">Main wallet</div><div class="s" data-name></div></div>
      <svg class="tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="grp">Balances</div>
    <div class="card">
      <div class="fld"><label for="btcIn">Bitcoin</label>
        <div class="inp"><input id="btcIn" type="number" inputmode="decimal" step="0.0001" min="0"><span>BTC</span></div>
        <div class="prev" id="prevB"></div></div>
      <div class="fld"><label for="ethIn">Ethereum</label>
        <div class="inp"><input id="ethIn" type="number" inputmode="decimal" step="0.0001" min="0"><span>ETH</span></div>
        <div class="prev" id="prevE"></div></div>
      <button class="btn pri save" onclick="saveBal()">Save</button>
    </div>
    <div class="fine">Lumora is a fictional wallet made as a stage prop.<br>Prices are live market data.</div>
  </section>

  <nav><div class="bar">
    <button data-nav="home" class="on" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Home</button>
    <button data-nav="wallet" onclick="go('wallet')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2M7 6V5a2 2 0 0 1 2-2h8"/></svg>Wallet</button>
  </div></nav>

  <div id="scrim" onclick="drawer(false)"></div>
  <aside id="drawer">
    <div class="dh"><div class="av" data-ini></div><div class="n" data-name></div><div class="s">Lumora</div></div>
    <div class="sec">Wallets</div>
    <button class="wrow" onclick="drawer(false)"><div class="av" data-ini></div>
      <div><div class="t">Main wallet</div><div class="s" id="dBal"></div></div>
      <svg class="tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
    <div class="fill"></div>
    <button class="mi" onclick="toast('Only one wallet on this device')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add wallet</button>
    <button class="mi" onclick="drawer(false);go('settings')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
    <button class="mi" onclick="toast('Support is offline')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.6c0 1.6-2.4 2.1-2.4 3.4M12 17h.01"/></svg>Help &amp; Support</button>
  </aside>

  <div id="toast"></div>
</div>

<template id="topTpl">
  <button class="acct" onclick="drawer(true)" aria-label="Open menu">
    <div class="av" data-ini></div>
  </button>
  <div class="ibs">
    <button class="ib" onclick="toast('No new notifications')"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9M10 20.5a2.2 2.2 0 0 0 4 0"/></svg></button>
    <button class="ib" onclick="toast('Camera unavailable')"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></svg></button>
  </div>
</template>

<script>
/* ===== EDIT THESE ===== */
const ACCOUNT_NAME = "Swaroop Mohan";
const DEFAULT_BTC  = 16.78;
const DEFAULT_ETH  = 2.45;
/* ====================== */

const COINS = [
  {id:"bitcoin",     sym:"BTC",  name:"Bitcoin",  usd:59151.47, ch:-6.17},
  {id:"ethereum",    sym:"ETH",  name:"Ethereum", usd:1660.47,  ch:-6.93},
  {id:"binancecoin", sym:"BNB",  name:"BNB",      usd:546.10,   ch:-6.79},
  {id:"solana",      sym:"SOL",  name:"Solana",   usd:68.25,    ch:-7.36},
  {id:"tether",      sym:"USDT", name:"Tether",   usd:1.00,     ch:0}
];
const ICONS = {
 bitcoin:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#F7931A"/><text x="16" y="22.5" text-anchor="middle" font-size="19" font-weight="700" fill="#fff" font-family="-apple-system,Arial" transform="rotate(14 16 16)">₿</text></svg>',
 ethereum:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#627EEA"/><g fill="#fff"><path d="M16 5v8.2l7 3.1z" fill-opacity=".6"/><path d="M16 5 9 16.3l7-3.1z"/><path d="M16 21.4V27l7-9.4z" fill-opacity=".6"/><path d="M16 27v-5.6l-7-3.8z"/><path d="M16 20.1l7-3.8-7-3.1z" fill-opacity=".2"/><path d="m9 16.3 7 3.8v-6.9z" fill-opacity=".6"/></g></svg>',
 binancecoin:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#F0B90B"/><g fill="#fff"><path d="M16 13.6 18.4 16 16 18.4 13.6 16z"/><path d="m16 7 4.6 4.6-1.4 1.4L16 9.8 12.8 13l-1.4-1.4z"/><path d="m16 25-4.6-4.6 1.4-1.4 3.2 3.2 3.2-3.2 1.4 1.4z"/><path d="m8.4 16 1.4-1.4 1.4 1.4-1.4 1.4z"/><path d="m20.8 16 1.4-1.4 1.4 1.4-1.4 1.4z"/></g></svg>',
 solana:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#1A1A1D"/><path fill="#9945FF" d="M10.6 19.6h13l-2.2 2.4h-13z"/><path fill="#14F195" d="M10.6 10h13l-2.2 2.4h-13z"/><path fill="#5FA0F0" d="M21.4 14.8h-13l2.2 2.4h13z"/></svg>',
 tether:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#26A17B"/><path fill="#fff" d="M17.9 17.1c-.1 0-.7.1-1.9.1-1 0-1.6 0-1.9-.1-3.5-.2-6.1-.8-6.1-1.5s2.6-1.4 6.1-1.5v2.4c.3 0 .9.1 1.9.1 1.2 0 1.8-.1 1.9-.1v-2.4c3.5.2 6.1.8 6.1 1.5s-2.6 1.4-6.1 1.5zm0-3.3v-2.2h4.9V8.3H9.3v3.3h4.8v2.2c-4 .2-7 1-7 1.9s3 1.7 7 1.9v6.9h3.8v-6.9c4-.2 6.9-1 6.9-1.9s-3-1.7-6.9-1.9z"/></svg>'
};

let INR_RATE = 96.0;  // offline fallback only
let live=false, hidden=false, prevScreen="home", curCoin="bitcoin";
const flashIds=new Set(), P={};
COINS.forEach(c=>P[c.id]={usd:c.usd, inr:c.usd*INR_RATE, ch:c.ch, spark:null});

const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let BTC=parseFloat(store.get("lumora_btc",DEFAULT_BTC))||0;
let ETH=parseFloat(store.get("lumora_eth",DEFAULT_ETH))||0;
const bal=id=>id==="bitcoin"?BTC:id==="ethereum"?ETH:0;

/* formatting */
const usd=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:v<1?4:2});
const inr=v=>"₹"+v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=v=>v.toLocaleString("en-US",{maximumFractionDigits:8});
const pct=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(2)+"%";
const cls=v=>v>=0?"up":"dn";
const mask=s=>hidden?"••••••":s;
const icon=c=>`<div class="ci">${ICONS[c.id]}</div>`;
const bigUsd=v=>{ if(hidden) return "••••••"; const s=usd(v), i=s.lastIndexOf("."); return s.slice(0,i)+"<small>"+s.slice(i)+"</small>"; };

function path(arr,w,h,pad){
  const mn=Math.min(...arr), mx=Math.max(...arr), r=(mx-mn)||1;
  return arr.map((v,i)=>`${i?"L":"M"}${(i/(arr.length-1)*w).toFixed(1)},${(pad+(1-(v-mn)/r)*(h-pad*2)).toFixed(1)}`).join("");
}
function spark(id,w,h,cl,fill){
  const p=P[id]; if(!p.spark) return `<svg class="${cl}" viewBox="0 0 ${w} ${h}"></svg>`;
  const col=p.ch>=0?"#5DBB8B":"#E36A62", d=path(p.spark,w,h,2), g="f"+id+w;
  return `<svg class="${cl}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${fill?`<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".14"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w},${h}L0,${h}Z" fill="url(#${g})" stroke="none"/>`:""}<path d="${d}" stroke="${col}" stroke-width="${fill?1.6:1.3}" vector-effect="non-scaling-stroke" fill="none"/></svg>`;
}

/* render */
function render(){
  const ini=ACCOUNT_NAME.split(/\s+/).map(s=>s[0]).join("").slice(0,2).toUpperCase();
  document.querySelectorAll("[data-name]").forEach(e=>e.textContent=ACCOUNT_NAME);
  document.querySelectorAll("[data-ini]").forEach(e=>e.textContent=ini);
  document.querySelectorAll("[data-first]").forEach(e=>e.textContent=ACCOUNT_NAME.split(" ")[0]);
  const hr=new Date().getHours();
  document.getElementById("greet").textContent=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  document.querySelectorAll("[data-dot]").forEach(e=>e.classList.toggle("on",live));
  document.querySelectorAll("[data-livetx]").forEach(e=>e.textContent=live?"Live":"Offline");

  // price cards
  const cards=document.getElementById("cards"), sx=cards.scrollLeft;
  cards.innerHTML=COINS.filter(c=>c.sym!=="USDT").map(c=>{const p=P[c.id];return `<button class="pc" onclick="openCoin('${c.id}')">
    <div class="h">${icon(c)}${c.sym}</div>
    <div class="pu${flashIds.has(c.id)?" flash":""}">${usd(p.usd)}</div><div class="pi">${inr(p.inr)}</div>
    <div class="ft"><span class="pg ${cls(p.ch)}">${pct(p.ch)}</span>${spark(c.id,62,22,"",false)}</div></button>`}).join("");
  cards.scrollLeft=sx; flashIds.clear();

  // markets
  document.getElementById("mkt").innerHTML=COINS.map(c=>{const p=P[c.id];return `<button class="row" onclick="openCoin('${c.id}')">${icon(c)}
    <div class="mid"><div class="t">${c.name}</div><div class="s">${c.sym} · <span class="${cls(p.ch)}">${pct(p.ch)}</span></div></div>
    ${spark(c.id,56,22,"sp",false)}
    <div class="r"><div class="t">${usd(p.usd)}</div><div class="s">${inr(p.inr)}</div></div></button>`}).join("");

  // totals
  let tU=0,tI=0,pU=0;
  COINS.forEach(c=>{const b=bal(c.id),p=P[c.id];tU+=b*p.usd;tI+=b*p.inr;pU+=b*p.usd/(1+p.ch/100)});
  const dU=tU-pU, dP=pU?dU/pU*100:0;
  document.getElementById("totUsd").innerHTML=bigUsd(tU);
  document.getElementById("totInr").textContent=mask(inr(tI));
  const tc=document.getElementById("totChg"); tc.className="c "+cls(dU);
  tc.textContent=hidden?"••••":`${dU>=0?"+":"−"}${usd(Math.abs(dU))}  ·  ${pct(dP)} today`;
  document.getElementById("eye").innerHTML=hidden
    ?'<path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 9.5 7 9.5 7a16 16 0 0 1-2.6 3.4M6.5 6.6C3.9 8.3 2.5 12 2.5 12s3.5 7 9.5 7a9 9 0 0 0 4.4-1.1"/>'
    :'<path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="2.6"/>';

  // assets
  const sorted=[...COINS].sort((a,b)=>bal(b.id)*P[b.id].usd-bal(a.id)*P[a.id].usd);
  document.getElementById("assets").innerHTML=sorted.map(c=>{const p=P[c.id],b=bal(c.id);return `<button class="row${b?"":" zero"}" onclick="openCoin('${c.id}')">${icon(c)}
    <div class="mid"><div class="t">${c.name}</div><div class="s">${mask(amt(b)+" "+c.sym)}</div></div>
    <div class="r"><div class="t">${mask(usd(b*p.usd))}</div><div class="s">${mask(inr(b*p.inr))}</div></div></button>`}).join("");

  document.getElementById("dBal").textContent=mask(usd(tU));
  renderCoin(); renderPrev();
}
function renderCoin(){
  const c=COINS.find(x=>x.id===curCoin), p=P[c.id], b=bal(c.id);
  document.getElementById("cTitle").textContent=c.name;
  document.getElementById("cIcon").innerHTML=icon(c);
  document.getElementById("cAmt").textContent=mask(amt(b)+" "+c.sym);
  document.getElementById("cUsd").textContent=mask(usd(b*p.usd));
  document.getElementById("cInr").textContent=mask(inr(b*p.inr));
  document.getElementById("cPrice").textContent=usd(p.usd);
  const g=document.getElementById("cChg"); g.className="g "+cls(p.ch); g.textContent=pct(p.ch);
  document.getElementById("kUsd").textContent=usd(p.usd);
  document.getElementById("kInr").textContent=inr(p.inr);
  const k=document.getElementById("kChg"); k.className=cls(p.ch); k.textContent=pct(p.ch);
  document.getElementById("kHold").textContent=mask(amt(b)+" "+c.sym);
  document.getElementById("cChart").innerHTML=spark(c.id,320,140,"",true).replace(/^<svg[^>]*>|<\/svg>$/g,"");
}
function renderPrev(){
  [["btcIn","prevB","bitcoin","BTC"],["ethIn","prevE","ethereum","ETH"]].forEach(([i,o,id,s])=>{
    const v=parseFloat(document.getElementById(i).value), p=P[id];
    document.getElementById(o).innerHTML=isNaN(v)?"Enter an amount.":`Worth <b>${usd(v*p.usd)}</b> · <b>${inr(v*p.inr)}</b> at today's price`;
  });
}

/* navigation */
function go(s){
  if(s==="home"||s==="wallet") prevScreen=s;
  document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on",e.id==="s-"+s));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===s));
  document.getElementById("s-"+s).scrollTop=0;
  if(s==="settings"){document.getElementById("btcIn").value=BTC;document.getElementById("ethIn").value=ETH;renderPrev();}
}
function openCoin(id){curCoin=id;renderCoin();go("coin")}
function drawer(on){document.getElementById("drawer").classList.toggle("on",on);document.getElementById("scrim").classList.toggle("on",on)}
function toggleHide(){hidden=!hidden;render()}
function saveBal(){
  const v=parseFloat(document.getElementById("btcIn").value), e=parseFloat(document.getElementById("ethIn").value);
  if(isNaN(v)||v<0||isNaN(e)||e<0){toast("Enter a valid amount");return}
  BTC=v;ETH=e;store.set("lumora_btc",String(v));store.set("lumora_eth",String(e));
  render();toast("Saved");setTimeout(()=>go("wallet"),450);
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1700)}
["btcIn","ethIn"].forEach(i=>document.getElementById(i).addEventListener("input",renderPrev));
document.querySelectorAll("[data-top]").forEach(e=>e.appendChild(document.getElementById("topTpl").content.cloneNode(true)));

/* live data: CoinGecko, with Binance as backup */
const IDS=COINS.map(c=>c.id).join(",");
async function loadPrices(){
  try{
    const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${IDS}&vs_currencies=usd,inr&include_24hr_change=true&_=${Date.now()}`,{cache:"no-store"});
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j.bitcoin&&j.bitcoin.usd&&j.bitcoin.inr) INR_RATE=j.bitcoin.inr/j.bitcoin.usd;
    COINS.forEach(c=>{const d=j[c.id];if(d&&d.usd){if(d.usd!==P[c.id].usd)flashIds.add(c.id);P[c.id].usd=d.usd;P[c.id].inr=d.inr||d.usd*INR_RATE;P[c.id].ch=d.usd_24h_change||0}});
    live=true;
  }catch(e){
    try{
      const map={BTCUSDT:"bitcoin",ETHUSDT:"ethereum",BNBUSDT:"binancecoin",SOLUSDT:"solana"};
      const r=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(Object.keys(map))));
      if(!r.ok) throw 0;
      (await r.json()).forEach(t=>{const id=map[t.symbol];if(id){const u=parseFloat(t.lastPrice);if(u!==P[id].usd)flashIds.add(id);P[id].usd=u;P[id].inr=u*INR_RATE;P[id].ch=parseFloat(t.priceChangePercent)}});
      live=true;
    }catch(e2){live=false}
  }
  render();
}
async function loadSparks(){
  try{
    const r=await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${IDS}&sparkline=true`);
    if(!r.ok) throw 0;
    (await r.json()).forEach(m=>{if(P[m.id]&&m.sparkline_in_7d)P[m.id].spark=m.sparkline_in_7d.price.filter((_,i)=>i%2===0)});
  }catch(e){
    COINS.forEach(c=>{if(!P[c.id].spark){let v=100,s=c.usd*1000|0;const rnd=()=>((s=(s*9301+49297)%233280)/233280-.5);
      P[c.id].spark=Array.from({length:84},(_,i)=>v+=rnd()*2.2+Math.sin(i/9)*.35+(c.ch/84))}});
  }
  render();
}

render();
const hideSplash=()=>document.getElementById("splash").classList.add("hide");
const t0=Date.now();
Promise.race([Promise.all([loadPrices(),loadSparks()]), new Promise(r=>setTimeout(r,4000))])
  .then(()=>setTimeout(hideSplash, Math.max(0, 900-(Date.now()-t0))));
setInterval(loadPrices,20000); setInterval(loadSparks,300000);
let lastFetch=Date.now();
const refresh=()=>{ if(Date.now()-lastFetch>3000){ lastFetch=Date.now(); loadPrices(); loadSparks(); } };
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
window.addEventListener("pageshow",refresh); window.addEventListener("focus",refresh);
</script>
